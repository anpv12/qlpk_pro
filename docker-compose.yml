services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: qlpk_postgres
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    restart: unless-stopped
    networks:
      - qlpk_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    security_opt:
      - no-new-privileges:true
    read_only: false

  # Flask Application
  app:
    build:
      context: .
      args:
        - APP_PORT=${APP_PORT:-8000}
    container_name: qlpk_app
    # Không expose port ra ngoài - chỉ nginx truy cập được qua Docker network
    # ports:
    #   - "${APP_PORT:-8000}:${APP_PORT:-8000}"
    env_file:
      - .env
    environment:
      - FLASK_APP=main.py
      - FLASK_ENV=${DEBUG:-false}
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - PORT=${APP_PORT:-8000}
      - QLPK_UPLOAD_ROOT=${QLPK_UPLOAD_ROOT:-/app/uploads}
      - REALTIME_REDIS_URL=${REALTIME_REDIS_URL:-redis://redis:6379/0}
      - TZ=Asia/Ho_Chi_Minh
    volumes:
      - .:/app
      - ./logs:/app/logs
      - ${QLPK_UPLOAD_HOST_PATH:-./uploads}:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - qlpk_network
    restart: unless-stopped
    command: ["gunicorn", "--bind", "0.0.0.0:8000", "--worker-class", "eventlet", "--workers", "1", "--timeout", "120", "--access-logfile", "-", "--error-logfile", "-", "main:app"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${APP_PORT:-8000}/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    security_opt:
      - no-new-privileges:true

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: qlpk_nginx
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"      # HTTP port 80
      - "${NGINX_HTTPS_PORT:-443}:443"   # HTTPS port 443
    env_file:
      - .env
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./app/static:${NGINX_STATIC_PATH:-/app/static}:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - app
    networks:
      - qlpk_network
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  # Redis (optional - for caching and sessions)
  redis:
    image: redis:7-alpine
    container_name: qlpk_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - qlpk_network
    restart: unless-stopped
    command: redis-server --ignore-warnings ARM64-COW-BUG --maxmemory 256mb --maxmemory-policy allkeys-lru
    security_opt:
      - no-new-privileges:true

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  qlpk_network:
    driver: bridge 
