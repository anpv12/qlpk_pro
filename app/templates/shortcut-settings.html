<!DOCTYPE html>
<html lang="vi">

<head>
	{% include 'partials/user-feedback-runtime.html' %}
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Cấu hình phím tắt</title>
	<meta name="qlpk-app-version" content="{{ app_version }}">
	<script src="/static/js/app-version-check.js?v={{ app_version }}"></script>
	<link href="/static/vendor/bootstrap@5.3.2/css/bootstrap.min.css" rel="stylesheet">
	<link rel="stylesheet" href="/static/vendor/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  {% include 'partials/brand-theme.html' %}
  <link rel="stylesheet" href="/static/css/pages/shortcut-settings.css?v={{ app_version }}">
	<script src="/static/vendor/jquery@3.7.1/jquery.min.js"></script>
	<script src="/static/js/sidebar-dry-loader.js?v={{ app_version }}"></script>
	<script src="/static/js/realtime-page-hooks.js?v={{ app_version }}"></script>
	<script src="/static/js/shortcut-manager-parts/part-1.js?v={{ app_version }}"></script>
	<script src="/static/js/shortcut-manager-parts/part-2.js?v={{ app_version }}"></script>
	<script src="/static/js/shortcut-manager.js?v={{ app_version }}"></script>
	<script src="/static/vendor/bootstrap@5.3.2/js/bootstrap.bundle.min.js"></script>
	<link rel="stylesheet" href="/static/css/shared/admin-management-ui.css?v={{ app_version }}">
	<link rel="stylesheet" href="/static/css/shared/clinic-workspace.css?v={{ app_version }}">
</head>

<body class="qlpk-data-tables qlpk-clinic-page qlpk-admin-page">
	<div class="container-fluid p-0">
		<div class="row g-0">
			<div id="sidebar-container" class="col-md-2 qlpk-shell-sidebar"></div>
			<main class="col-md-10 main-content" id="shortcutSettingsPage">
				<div class="shortcut-page-wrap">
					<div class="qlpk-clinic-header">
						<div class="qlpk-clinic-header-copy"><h1 class="qlpk-clinic-title">Phím tắt menu</h1>
						<p class="qlpk-clinic-subtitle">Thiết lập tổ hợp phím để mở nhanh các màn hình trong hệ thống.</p></div>
					</div>

					<div id="shortcutAlert" class="alert shortcut-hidden"></div>

					<div class="shortcut-card p-3 mb-3">
						<form id="shortcutForm" class="row g-3 align-items-end qlpk-shortcut-form">
							<input type="hidden" id="shortcutId">

							<div class="col-12 col-lg-3 shortcut-hidden" id="shortcutScopeInlineWrap">
								<label class="form-label">Phạm vi cấu hình</label>
								<select id="shortcutScope" class="form-select">
									<option value="mine">Shortcut của tôi</option>
									<option value="all-users">Tất cả user</option>
									<option value="global">Toàn hệ thống (Global)</option>
									<option value="user">Theo user cụ thể</option>
								</select>
							</div>

							<div class="col-12 col-lg-3 shortcut-hidden" id="shortcutTargetUserWrap">
								<label class="form-label">User áp dụng</label>
								<select id="shortcutTargetUser" class="form-select">
									<option value="">-- Chọn user --</option>
								</select>
							</div>

							<div class="col-12 col-lg-3">
								<label class="form-label">Màn hình đích</label>
								<select id="shortcutRoute" class="form-select" required>
									<option value="">-- Chọn màn hình --</option>
								</select>
								<input id="shortcutUrl" type="hidden" required>
							</div>

							<div class="col-12 col-lg-3">
								<label class="form-label">Tổ hợp phím</label>
								<input id="shortcutCombo" type="text" class="form-control" placeholder="Nhấn tổ hợp phím (vd: Ctrl+1)" autocomplete="off" required>
							</div>

							<div class="col-12 d-flex justify-content-between align-items-center">
								<div>
									<span class="text-muted me-2">Tổ hợp hiện tại:</span>
									<span id="shortcutComboPreview" class="shortcut-combo-preview">Chưa chọn</span>
								</div>
								<div class="d-flex gap-2">
									<button data-qlpk-button="neutral" data-qlpk-button-variant="soft" type="button" id="shortcutClearBtn" class="btn btn-outline-secondary">Làm mới</button>
									<button data-qlpk-button="execute" data-qlpk-button-variant="solid" type="submit" class="btn btn-primary">Lưu phím tắt</button>
								</div>
							</div>
						</form>
					</div>

					<div class="shortcut-card p-3">
						<h6 class="mb-3">Danh sách phím tắt của bạn</h6>
						<div class="table-responsive">
							<table class="table table-hover align-middle mb-0">
								<thead>
									<tr>
										<th>Tổ hợp</th>
											<th>Tên màn hình</th>
											<th>URL</th>
											<th>Phạm vi</th>
											<th>User áp dụng</th>
											<th></th>
									</tr>
								</thead>
								<tbody id="shortcutTableBody"></tbody>
							</table>
						</div>
					</div>
				</div>
			</main>
		</div>
	</div>

</body>

</html>
