<!DOCTYPE html>
<html lang="vi">

<head>
	{% include 'partials/user-feedback-runtime.html' %}
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Tạo mới mẫu khảo sát | QLPK</title>
	<meta name="description" content="Tạo và cấu hình mẫu khảo sát tâm lý lâm sàng">

	<!-- Libs -->
	<link rel="stylesheet" href="/static/vendor/bootstrap@5.3.2/css/bootstrap.min.css">
	<link rel="stylesheet" href="/static/vendor/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
	<link href="/static/vendor/roboto/roboto.css" rel="stylesheet">
  {% include 'partials/brand-theme.html' %}
  <link rel="stylesheet" href="/static/css/pages/survey-template-create.css?v={{ app_version }}">
  <link rel="stylesheet" href="/static/css/components/survey-template-utils.css?v={{ app_version }}">
	<link rel="stylesheet" href="/static/css/shared/clinic-workspace.css?v={{ app_version }}">
</head>

<body class="sc-page qlpk-clinic-page">
	<div class="container-fluid p-0">
		<div class="row g-0">
			<!-- Sidebar (DRY loader) -->
			<div id="sidebar-container" class="col-lg-2 qlpk-shell-sidebar"></div>

			<!-- Main -->
			<div class="col-12 sc-main">

				<!-- ── Header ── -->
				<div class="sc-header qlpk-clinic-header">
					<div class="sc-header-left">
						<a href="/survey-template-management.html" class="sc-back-btn" title="Quay lại danh sách">
							<i class="bi bi-arrow-left"></i>
						</a>
						<span class="sc-page-title qlpk-clinic-title" id="pageTitle">Tạo mới khảo sát</span>
					</div>
					<div class="sc-header-right">
						<button data-qlpk-button="execute" data-qlpk-button-variant="solid" class="sc-btn-draft" id="saveDraftBtn">Lưu tạm</button>
						<button data-qlpk-button="execute" data-qlpk-button-variant="solid" class="sc-btn-save" id="saveBtn">
							<i class="bi bi-check2 sc-save-icon"></i> Lưu
						</button>
					</div>
				</div>

				<!-- ── Tabs ── -->
				<div class="sc-tabs">
					<button class="sc-tab active" data-tab="questions" id="tabQuestions">1. Cấu hình câu hỏi</button>
					<button class="sc-tab" data-tab="results" id="tabResults">2. Cấu hình kết quả</button>
				</div>

				<!-- ── Scrollable content ── -->
				<div class="sc-content">
					<div class="sc-inner">

						<!-- TAB 1: Cấu hình câu hỏi -->
						<div id="tab-questions" class="sc-tab-pane active">

							<!-- Survey info card -->
							<div class="sc-info-card">
								<div class="sc-info-accent"></div>
								<div class="sc-info-body">
									<input type="text" id="surveyName" class="sc-survey-name"
										placeholder="Nhập tên mẫu khảo sát...">
									<textarea id="surveyDesc" class="sc-survey-desc"
										placeholder="Mô tả mẫu khảo sát (tùy chọn)..." rows="3"></textarea>
									<label class="sc-survey-performer-field" for="surveyPerformer">
										<span>Người thực hiện mặc định</span>
										<select id="surveyPerformer" class="sc-survey-performer">
											<option value="">Chưa gán (chọn sau khi chỉ định)</option>
										</select>
									</label>
								</div>
							</div>

							<!-- Questions list (SortableJS target) -->
							<div id="questionsList"></div>

							<!-- Add question -->
							<div class="sc-add-q-wrap">
								<button data-qlpk-button="execute" data-qlpk-button-variant="solid" class="sc-add-q-btn" id="addQuestionBtn">
									<i class="bi bi-plus-circle"></i> Thêm câu hỏi
								</button>
							</div>
						</div>

						<!-- TAB 2: Cấu hình kết quả (placeholder) -->
						<div id="tab-results" class="sc-tab-pane">
							<div class="sc-analytics-placeholder">
								<i class="bi bi-bar-chart-line sc-analytics-placeholder-icon"></i>
								<p class="sc-analytics-placeholder-copy">Tab này sẽ mở sau khi hoàn thành cấu hình câu hỏi.</p>
							</div>
						</div>

					</div>
				</div>

			</div>
		</div>
	</div>

	<!-- Scripts -->
	<script src="/static/vendor/jquery@3.7.1/jquery.min.js"></script>
	<script src="/static/vendor/bootstrap@5.3.2/js/bootstrap.bundle.min.js"></script>
	<script src="/static/vendor/sortablejs@1.15.0/Sortable.min.js"></script>
	<script src="/static/js/sidebar-dry-loader.js?v={{ app_version }}"></script>
	<script src="/static/js/realtime-page-hooks.js?v={{ app_version }}"></script>
	<script src="/static/js/survey-template-create-parts/part-1.js?v={{ app_version }}"></script>
	<script src="/static/js/survey-template-create-parts/part-2.js?v={{ app_version }}"></script>
	<script src="/static/js/survey-template-create.js?v={{ app_version }}"></script>
</body>

</html>
