<!DOCTYPE html>
<html lang="vi">

<head>
	{% include 'partials/user-feedback-runtime.html' %}
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Tạo mới mẫu khảo sát | QLPK</title>
	<meta name="description" content="Tạo và cấu hình mẫu khảo sát tâm lý lâm sàng">

	<!-- Libs -->
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
	<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/pages/survey-template-create.css?v={{ app_version }}">
</head>

<body class="sc-page">
	<div class="container-fluid p-0">
		<div class="row g-0">
			<!-- Sidebar (DRY loader) -->
			<div id="sidebar-container" class="col-lg-2"></div>

			<!-- Main -->
			<div class="col-lg-10 sc-main">

				<!-- ── Header ── -->
				<div class="sc-header">
					<div class="sc-header-left">
						<a href="/survey-template-management.html" class="sc-back-btn" title="Quay lại danh sách">
							<i class="bi bi-arrow-left"></i>
						</a>
						<span class="sc-page-title" id="pageTitle">Tạo mới khảo sát</span>
					</div>
					<div class="sc-header-right">
						<button class="sc-btn-draft" id="saveDraftBtn">Lưu tạm</button>
						<button class="sc-btn-save" id="saveBtn">
							<i class="bi bi-check2 sc-save-icon"></i> Lưu
						</button>
					</div>
				</div>

				<!-- ── Tabs ── -->
				<div class="sc-tabs">
					<button class="sc-tab active" data-tab="questions" id="tabQuestions">1. Cấu hình câu hỏi</button>
					<button class="sc-tab" data-tab="results" id="tabResults">2. Cấu hình kết quả</button>
				</div>

				<!-- ── Scrollable content ── -->
				<div class="sc-content">
					<div class="sc-inner">

						<!-- TAB 1: Cấu hình câu hỏi -->
						<div id="tab-questions" class="sc-tab-pane active">

							<!-- Survey info card -->
							<div class="sc-info-card">
								<div class="sc-info-accent"></div>
								<div class="sc-info-body">
									<input type="text" id="surveyName" class="sc-survey-name"
										placeholder="Nhập tên mẫu khảo sát...">
									<textarea id="surveyDesc" class="sc-survey-desc"
										placeholder="Mô tả mẫu khảo sát (tùy chọn)..." rows="3"></textarea>
								</div>
							</div>

							<!-- Questions list (SortableJS target) -->
							<div id="questionsList"></div>

							<!-- Add question -->
							<div class="sc-add-q-wrap">
								<button class="sc-add-q-btn" id="addQuestionBtn">
									<i class="bi bi-plus-circle"></i> Thêm câu hỏi
								</button>
							</div>
						</div>

						<!-- TAB 2: Cấu hình kết quả (placeholder) -->
						<div id="tab-results" class="sc-tab-pane">
							<div class="sc-analytics-placeholder">
								<i class="bi bi-bar-chart-line sc-analytics-placeholder-icon"></i>
								<p class="sc-analytics-placeholder-copy">Tab này sẽ mở sau khi hoàn thành cấu hình câu hỏi.</p>
							</div>
						</div>

					</div>
				</div>

			</div>
		</div>
	</div>

	<!-- Toast notification -->
	<div class="sc-toast" id="scToast">
		<i class="bi bi-check-circle-fill" id="scToastIcon"></i>
		<span id="scToastMsg"></span>
	</div>

	<!-- Scripts -->
	<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
	<script src="/static/js/permission-check.js?v={{ app_version }}"></script>
	<script src="/static/js/sidebar-dry-loader.js?v={{ app_version }}"></script>
	<script src="/static/js/realtime-page-hooks.js?v={{ app_version }}"></script>
	<script src="/static/js/survey-template-create.js?v={{ app_version }}"></script>
</body>

</html>
