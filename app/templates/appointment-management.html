<!DOCTYPE html>
<html lang="vi">

<head>
	{% from 'partials/page-head.html' import page_head with context %}{{ page_head('Lịch hẹn') }}
	<link href="/static/vendor/fullcalendar@5.11.3/main.min.css" rel="stylesheet">
  {% include 'partials/brand-theme.html' %}
	<link rel="stylesheet" href="/static/css/shared/typography.css?v={{ app_version }}">
	<link rel="stylesheet" href="/static/css/shared/icon-tokens.css?v={{ app_version }}">
	<link rel="stylesheet" href="/static/css/custom-modal.css?v={{ app_version }}">

	{% include 'partials/flatpickr.html' %}
	<link rel="stylesheet" href="/static/css/holiday-calendar.css?v={{ app_version }}">
	<script src="/static/vendor/bootstrap@5.3.2/js/bootstrap.bundle.min.js"></script>
	<script src="/static/vendor/fullcalendar@5.11.3/main.min.js"></script>
	<script src="/static/vendor/fullcalendar@5.11.3/locales/vi.js"></script>
	<link rel="stylesheet" href="/static/css/flatpickr-custom.css?v={{ app_version }}">
	<link rel="stylesheet" href="/static/css/appointment-management.css?v={{ app_version }}">
	<link rel="stylesheet" href="/static/css/components/appointment-calendar.css?v={{ app_version }}">
	<link rel="stylesheet" href="/static/css/components/autocomplete-field.css?v={{ app_version }}">
</head>

<body>
	<!-- Hidden sidebar container - sidebar-dry-loader needs this to avoid overlay -->
	<div id="sidebar-container" class="qlpk-shell-sidebar"></div>

	<!-- Layout toàn màn hình -->
	<div class="appointment-fullscreen">
			<!-- TOP HEADER BAR -->
			<div class="appt-header-bar" data-qlpk-button-surface="dark">
				<div class="appt-header-left">
					<i class="bi bi-calendar-check"></i>
				</div>
			<div class="appt-search-wrapper">
				<i class="bi bi-search search-icon"></i>
				<input type="text" class="appt-calendar-search" id="calendarSearchInput" aria-label="Tìm theo tên, SĐT bệnh nhân" placeholder="Tìm theo tên, SĐT bệnh nhân...">
				<button data-qlpk-button="neutral" data-qlpk-button-variant="soft" type="button" class="search-clear-btn" id="calendarSearchClear" title="Xóa" aria-label="Xóa tìm kiếm">&times;</button>
			</div>
			<div class="appt-header-filter">
				<label class="appt-header-filter-label" for="doctorFilter">Bác sĩ</label>
				<select class="form-select form-select-sm appt-header-doctor-select" id="doctorFilter">
					<option value="">Tất cả bác sĩ</option>
				</select>
			</div>
			<div class="appt-header-actions">
				<button data-qlpk-button="execute" data-qlpk-button-variant="soft" class="btn appointment-button appointment-button--header appointment-button--sm qlpk-sync-calendar-btn" id="syncCalendarBtn" data-bs-toggle="modal"
					data-bs-target="#syncCalendarModal" title="Đồng bộ" aria-label="Đồng bộ lịch Google">
					<i class="bi bi-arrow-repeat"></i> <span class="btn-text-label">Đồng bộ</span>
				</button>
				<div class="calendar-integration-section">
					<div id="calendarStatus" class="qlpk-calendar-status"></div>
					<button data-qlpk-button="execute" data-qlpk-button-variant="soft" class="btn appointment-button appointment-button--header appointment-button--sm appointment-hidden" id="connectGoogleCalendarBtn" title="Kết nối Google Calendar" aria-label="Kết nối Google Calendar">
						<i class="bi bi-google"></i> <span class="btn-text-label">Kết nối Google Calendar</span>
					</button>
					<button data-qlpk-button="danger" data-qlpk-button-variant="soft" class="btn appointment-button appointment-button--header appointment-button--sm appointment-hidden" id="disconnectGoogleCalendarBtn" title="Ngắt kết nối Google Calendar" aria-label="Ngắt kết nối Google Calendar">
						<i class="bi bi-x-circle"></i> <span class="btn-text-label">Ngắt kết nối</span>
					</button>
				</div>
				<button data-qlpk-button="execute" data-qlpk-button-variant="solid" class="btn appointment-button appointment-button--header appointment-button--sm" data-bs-toggle="modal"
					data-bs-target="#addAppointmentModal" title="Thêm lịch hẹn" aria-label="Thêm lịch hẹn">
					<i class="bi bi-plus-circle"></i> <span class="btn-text-label">Thêm lịch hẹn</span>
				</button>
				<button data-qlpk-button="neutral" data-qlpk-button-variant="soft" class="btn appointment-button appointment-button--header appointment-button--sm qlpk-export-data-btn" type="button" id="exportDataBtn" title="Xuất dữ liệu" aria-label="Xuất dữ liệu lịch hẹn">
					<i class="bi bi-download"></i> <span class="btn-text-label">Xuất dữ liệu</span>
				</button>

			</div>
			<a href="/" class="appt-close-btn" title="Về trang chủ" aria-label="Về trang chủ">&times;</a>
		</div>

		<!-- BODY: Left Panel + Main -->
		<div class="appt-body">
			<!-- LEFT PANEL -->
			<aside class="appt-left-panel">
				<!-- Mini Calendar (Flatpickr inline) -->
				<div class="appt-panel-section">
					<div id="miniCalendar" class="qlpk-mini-calendar"></div>
				</div>

				<!-- Trạng thái -->
				<div class="appt-panel-section appt-panel-section--status">
					<label class="appt-panel-label">TRẠNG THÁI</label>
					<div class="appt-status-list qlpk-calendar-statuses"></div>
				</div>

				<!-- Legend bác sĩ -->
				<div class="appt-panel-section">
					<label class="appt-panel-label">MÀU BÁC SĨ</label>
					<div class="appt-doctor-legend" id="doctorLegendDoctor">
						<!-- JS sẽ populate -->
					</div>
				</div>

				<!-- Legend tâm lý gia -->
				<div class="appt-panel-section">
					<label class="appt-panel-label">MÀU TÂM LÝ GIA</label>
					<div class="appt-doctor-legend" id="doctorLegendPsychologist">
						<!-- JS sẽ populate -->
					</div>
				</div>

			</aside>

			<!-- MAIN CALENDAR AREA -->
			<main class="appt-main">
				<!-- Calendar View -->
				<div id="calendarViewContainer" class="qlpk-calendar-view-container">
					<div class="calendar-container">
						<div id="calendar" class="qlpk-calendar"></div>
					</div>
				</div>

			</main>
		</div>
	</div>

	{% include "partials/appointment-management-modals.html" %}

	<script type="module" src="/static/js/appointment-management.js?v={{ app_version }}"></script>

</body>

</html>
