<!-- Modal: Quản lý người đi khám cùng - DRY -->
<div class="modal fade" id="jointExamModal" tabindex="-1" aria-labelledby="jointExamModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-xl">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="jointExamModalLabel">
                    <i class="bi bi-people-fill joint-exam-title-icon" aria-hidden="true"></i>Người đi khám cùng
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div class="joint-exam-table-toolbar">
                    <button type="button" class="btn-add-joint-exam joint-exam-add-btn">
                        <i class="bi bi-plus-circle joint-exam-title-icon" aria-hidden="true"></i>Thêm người đi cùng
                    </button>
                </div>
                <div class="joint-exam-table-body">
                    <div class="joint-exam-table-scroll">
                        <table class="joint-exam-table">
                            <thead>
                                <tr>
                                    <th>STT</th>
                                    <th>Họ tên</th>
                                    <th>Quan hệ</th>
                                    <th>CCCD/CMND</th>
                                    <th>Số điện thoại</th>
                                    <th>Ngày đi cùng</th>
                                    <th class="joint-exam-action-column">Thao tác</th>
                                </tr>
                            </thead>
                            <tbody id="jointExamTableBody">
                                <!-- Sẽ được populate bởi JS -->
                            </tbody>
                        </table>
                    </div>
                    <div class="joint-exam-empty-state">
                        <p class="joint-exam-empty-state__title">Chưa có người đi cùng</p>
                        <p class="joint-exam-empty-state__subtitle">Thêm người đi cùng cho lần khám này.</p>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="joint-exam-close-btn" data-bs-dismiss="modal">Đóng</button>
            </div>
        </div>
    </div>
</div>
