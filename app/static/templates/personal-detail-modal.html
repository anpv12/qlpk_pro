<!-- Modal Thông tin đầy đủ - DRY Template -->
<div class="modal fade qlpk-personal-detail-modal" id="personalDetailModal" tabindex="-1" aria-labelledby="personalDetailModalLabel"
	aria-hidden="true">
	<div class="modal-dialog modal-lg personal-detail-dialog">
		<div class="modal-content">
			<div class="modal-header">
				<h5 class="modal-title" id="personalDetailModalLabel">Thông tin chi tiết</h5>
				<button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
			</div>
			<div class="modal-body">
				<!-- Section 1: Địa chỉ chi tiết -->
				<div class="mb-4 modal-section" data-section="address">
					<div class="row mb-3">
						<div class="col-md-12">
							<label class="form-label">ĐỊA CHỈ (SỐ NHÀ, TÊN ĐƯỜNG):</label>
							<input type="text" class="form-control" id="modalAddressDetail"
								placeholder="Nhập số nhà, tên đường">
						</div>
					</div>
					<div class="row mb-3">
						<div class="col-md-6">
							<label class="form-label">TỈNH / THÀNH PHỐ:</label>
							<div class="position-relative">
								<input type="text" class="form-control" id="modalProvince"
									placeholder="Nhập hoặc chọn tỉnh/thành phố" autocomplete="off">
								<div class="autocomplete-dropdown personal-detail-hidden" id="modalProvinceDropdown">
								</div>
							</div>
						</div>
						<div class="col-md-6">
							<label class="form-label">XÃ/PHƯỜNG/ĐẶC KHU:</label>
							<div class="position-relative">
								<input type="text" class="form-control" id="modalWard"
									placeholder="Nhập hoặc chọn xã/phường" autocomplete="off">
								<div class="autocomplete-dropdown personal-detail-hidden" id="modalWardDropdown">
								</div>
							</div>
						</div>
					</div>
				</div>

				<!-- Section 2: CMT/CCCD & Thông tin cá nhân -->
				<div class="mb-4 modal-section" data-section="identity">
					<div class="row mb-3">
						<div class="col-md-6">
							<label class="form-label">CMT/CCCD:</label>
							<input type="text" class="form-control" id="modalIdCard" placeholder="Nhập số CMT/CCCD"
								maxlength="12">
						</div>
						<div class="col-md-6">
							<label class="form-label">QUỐC TỊCH:</label>
							<div class="position-relative">
								<input type="text" class="form-control" id="modalNationality"
									placeholder="Nhập hoặc chọn quốc tịch">
								<div class="autocomplete-dropdown personal-detail-hidden qlpk-modal-nationality-dropdown" id="modalNationalityDropdown">
								</div>
							</div>
						</div>
					</div>

					<div class="row mb-3">
						<div class="col-md-6">
							<label class="form-label">TÔN GIÁO:</label>
							<div class="position-relative">
								<input type="text" class="form-control" id="modalReligion"
									placeholder="Nhập hoặc chọn tôn giáo">
								<div class="autocomplete-dropdown personal-detail-hidden qlpk-modal-religion-dropdown" id="modalReligionDropdown">
								</div>
							</div>
						</div>
						<div class="col-md-6">
							<label class="form-label">DÂN TỘC:</label>
							<div class="position-relative">
								<input type="text" class="form-control" id="modalEthnicity" placeholder="Nhập dân tộc">
								<div class="autocomplete-dropdown personal-detail-hidden qlpk-modal-ethnicity-dropdown" id="modalEthnicityDropdown">
								</div>
							</div>
						</div>
					</div>
				</div>

				<!-- Section 3: Thông tin nghề nghiệp -->
				<div class="mb-4 modal-section" data-section="occupation">
					<div class="row mb-3">
						<div class="col-md-6">
							<label class="form-label">NGHỀ NGHIỆP:</label>
							<div class="position-relative personal-detail-autocomplete-field">
								<input type="text" class="form-control personal-detail-autocomplete-input" id="modalOccupation"
									placeholder="Nhập nghề nghiệp">
								<div class="autocomplete-dropdown personal-detail-hidden qlpk-modal-occupation-dropdown" id="modalOccupationDropdown">
								</div>
							</div>
						</div>
						<div class="col-md-6">
							<label class="form-label">ĐƠN VỊ CÔNG TÁC:</label>
							<input type="text" class="form-control" id="modalDonViCongTac"
								placeholder="Nhập đơn vị công tác">
						</div>
					</div>
					<div class="row mb-3">
						<div class="col-md-6">
							<label class="form-label">ĐỊA CHỈ CÔNG TY:</label>
							<input type="text" class="form-control" id="modalDiaChiCongTy"
								placeholder="Nhập địa chỉ công ty">
						</div>
						<div class="col-md-6">
							<label class="form-label">TRÌNH ĐỘ HỌC VẤN:</label>
							<div class="position-relative personal-detail-autocomplete-field">
								<input type="text" class="form-control personal-detail-autocomplete-input" id="modalEducationLevel"
									placeholder="Nhập học vấn">
								<div class="autocomplete-dropdown personal-detail-hidden qlpk-modal-education-level-dropdown" id="modalEducationLevelDropdown"></div>
							</div>
						</div>
					</div>
				</div>

				<!-- Section 4: Thông tin giới tính -->
				<div class="mb-4 modal-section" data-section="gender">
					<div class="row mb-3">
						<div class="col-md-3">
							<label class="form-label">GIỚI TÍNH:</label>
							<select class="form-select" id="modalGender">
								<option value="male">Nam</option>
								<option value="female">Nữ</option>
								<option value="other">Khác</option>
							</select>
						</div>
						<div class="col-md-2 personal-detail-pregnancy-section qlpk-pregnancy-section" id="pregnancySection">
							<label class="form-label">MANG THAI:</label>
							<div class="form-check d-flex align-items-center personal-detail-check-row">
								<input class="form-check-input" type="checkbox" id="modalMangThai" value="1">
								<label class="form-check-label mb-0 ms-2" for="modalMangThai">
									Mang thai
								</label>
							</div>
						</div>
						<div class="col-md-3" id="ngayDuSinhSection">
							<label class="form-label">NGÀY DỰ SINH:</label>
							<input type="date" class="form-control" id="modalNgayDuSinh" placeholder="Chọn ngày dự sinh"
								min="">
						</div>
						<div class="col-md-3" id="soTuanThaiSection">
							<label class="form-label">SỐ TUẦN THAI:</label>
							<input type="text" class="form-control" id="modalSoTuanThai" placeholder="Tự động tính"
								readonly disabled>
						</div>
					</div>
					<div class="row mb-3">
						<div class="col-md-12">
							<label class="form-label">XU HƯỚNG TÍNH DỤC:</label>
							<div class="position-relative">
								<input type="text" class="form-control" id="modalSexualOrientation"
									placeholder="Nhập xu hướng tính dục">
								<div class="autocomplete-dropdown personal-detail-hidden qlpk-modal-sexual-orientation-dropdown" id="modalSexualOrientationDropdown"></div>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>
</div>
